{% extends 'www/base.html' %}

{% block style %}
        <style>
            .project-wrap h2{position:relative}.rm .project-title::before{content:'';width:100%;height:1px;background-color:#ccc;position:absolute;bottom:-8px;}.ch .project-title::before{content:'';width:100%;height:1px;background-color:#f9b695;position:absolute;bottom:-8px;}.mt-8{margin-top:8px}.project-wrap{display:flex;flex-direction:column}.project-box{width:100%;border-radius:3px}.project-wrap.rm{background-image:linear-gradient(135deg,#eee 0,#ccc 100%);border:1px #ccc solid}.project-wrap.ch{background-image:linear-gradient(135deg,#fad3be 0,#f9b695 100%);border:1px #f9b695 solid}@media only screen and (min-width:576px){.portfolio-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:20px;}.project-wrap{flex-direction:row;justify-content:space-between}}
        </style>
{% endblock style %}

{% block content %}
                    <h1>Portfolio</h1>
                    <div class="portfolio-grid">
                        <div class="project-wrap rm mt-20">
                            <a class="project-box p-20" href="{% url 'bio' %}">
                                <h2 class="project-title mb-20">Ricardo Mendoza</h2>
                                <p class="mt-8">{{ desc_project_rm }}</p>
                            </a>
                        </div>
                        <div class="project-wrap ch mt-20">
                            <a class="project-box p-20" href="{{ chingu_url }}" target="_blank" rel="noopener noreferrer">
                                <h2 class="project-title mb-20">Chingu - Asian Street Food</h2>
                                <p class="mt-8">{{ desc_project_chingu }}</p>
                            </a>
                        </div>
                    </div>
{% endblock content %}
